<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Initialize DayTrack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Base Dark Canvas */
        body {
            background-color: #020617;
            color: #f8fafc;
            overflow: hidden;
            margin: 0;
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* Subtle Matrix/System Grid Background */
        .bg-grid {
            position: absolute;
            inset: 0;
            background-size: 50px 50px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
            z-index: 0;
        }

        /* Fluid Blob Animations */
        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }
        .animate-blob { animation: blob 7s infinite; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        /* Entrance Animation for the Card */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-entrance {
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Input Auto-fill override to keep it dark */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus,
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px #020617 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* UPGRADED: Floating Data Stream CSS */
        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0.8); opacity: 0; }
            10% { opacity: 0.5; } /* Bumped opacity up to 50% for high visibility */
            90% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
        }
        .data-stream-text {
            position: absolute;
            font-family: monospace;
            white-space: nowrap;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 700; /* Bolder text */
            pointer-events: none;
            animation: floatUp linear forwards;
            text-shadow: 0 0 10px currentColor; /* This makes the text literally glow */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center relative">

<div class="bg-grid"></div>

<div id="data-stream-layer" class="absolute inset-0 overflow-hidden pointer-events-none z-0"></div>

<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg h-full max-h-lg pointer-events-none z-0">
    <div class="absolute top-0 -left-4 w-72 h-72 bg-cyan-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob"></div>
    <div class="absolute top-0 -right-4 w-72 h-72 bg-blue-600 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-purple-500 rounded-full mix-blend-screen filter blur-[100px] opacity-30 animate-blob animation-delay-4000"></div>
</div>

<div class="relative z-10 w-full max-w-md p-8 sm:p-10 bg-slate-900/60 backdrop-blur-xl rounded-3xl border border-slate-700/50 shadow-[0_0_50px_-12px_rgba(0,0,0,0.8)] animate-entrance">

    <div class="flex justify-center mb-8 relative">
        <div class="absolute inset-0 bg-cyan-500 blur-xl opacity-20 rounded-full"></div>
        <div class="w-14 h-14 bg-gradient-to-br from-cyan-400 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg relative z-10">
            <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
        </div>
    </div>

    <h1 class="text-3xl font-extrabold tracking-tight text-white text-center mb-2 drop-shadow-md">DayTrack <span class="text-cyan-400">OS</span></h1>
    <p class="text-slate-400 text-center text-sm mb-10 font-medium tracking-wide">Establish your identity. Initialize your ledger.</p>

    <form action="/login" method="POST" class="space-y-6">
        <div class="group">
            <label class="block text-[11px] font-bold text-slate-400 mb-2 uppercase tracking-widest group-focus-within:text-cyan-400 transition-colors">Monk Handle</label>
            <div class="relative">
                <input type="text" name="username" required autocomplete="off" placeholder="e.g. system-architect"
                       class="w-full bg-slate-950/80 border border-slate-700 rounded-xl py-4 pl-12 pr-4 text-white text-sm focus:ring-2 focus:ring-cyan-500/50 focus:border-cyan-400 transition-all shadow-inner outline-none placeholder-slate-600">
                <div class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-cyan-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>
        </div>

        <button type="submit" class="relative w-full overflow-hidden rounded-xl p-[1px] group mt-4">
            <span class="absolute inset-0 bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 opacity-70 group-hover:opacity-100 transition-opacity duration-300 animate-pulse"></span>
            <div class="relative bg-slate-900/90 group-hover:bg-slate-900/50 backdrop-blur-sm rounded-xl py-4 transition-all duration-300">
                <span class="block text-white font-bold tracking-widest uppercase text-xs">Initialize Protocol</span>
            </div>
        </button>
    </form>
</div>

<script>
    const phrases = [
        "CALCULATE EFFICIENCY", "LOCK TIME BLOCKS", "NIGHTLY ORCHESTRATION",
        "RIPPLE SHIFT SCHEDULE", "ANALYZE GOLDEN ZONES", "CLONE PROTOCOL",
        "ELIMINATE WASTED TIME", "INITIATE MONK MODE", "SYSTEM ARCHITECTURE",
        "DATA STRUCTURES", "DEEP WORK ACTIVE", "ALGORITHM OPTIMIZATION",
        "TRACK MACRO TRENDS", "ENTER THE ZONE", "EXECUTE PROTOCOL"
    ];

    // Replaced dull slate colors with bright neon variants
    const colors = [
        "text-cyan-400", "text-blue-400", "text-purple-400", "text-emerald-400", "text-indigo-400"
    ];

    const layer = document.getElementById('data-stream-layer');

    function spawnDataStream() {
        const span = document.createElement('span');

        span.innerText = phrases[Math.floor(Math.random() * phrases.length)];
        span.style.left = Math.random() * 100 + 'vw';

        // Made the text slightly larger on average (14px to 28px)
        const size = Math.floor(Math.random() * 14) + 14;
        span.style.fontSize = size + 'px';

        span.className = 'data-stream-text ' + colors[Math.floor(Math.random() * colors.length)];

        const duration = Math.random() * 15 + 15;
        span.style.animationDuration = duration + 's';

        layer.appendChild(span);

        span.addEventListener('animationend', () => {
            span.remove();
        });
    }

    setInterval(spawnDataStream, 800);

    for(let i=0; i<10; i++) {
        setTimeout(spawnDataStream, Math.random() * 2000);
    }
</script>
</body>
</html>
