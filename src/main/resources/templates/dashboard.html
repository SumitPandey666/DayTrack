<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Continuous Time Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen p-8 relative">

<div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

<div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

    <div class="lg:col-span-1 space-y-8">

        <div id="efficiency-metric" class="bg-slate-800 px-6 py-6 rounded-xl border border-slate-700 text-center shadow-lg">
            <p class="text-sm text-slate-400 uppercase tracking-wide font-semibold">Daily Efficiency</p>
            <p class="text-5xl font-bold text-emerald-400 mt-2" th:text="${efficiencyScore + '%'}">100.0%</p>
            <p class="text-xs text-slate-500 mt-2" th:text="${currentDate}">2026-03-13</p>
        </div>

        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold mb-2 text-white">Reality Adjustment</h2>
            <form hx-post="/ui/blocks/shift" hx-target="#protocol-container" hx-swap="outerHTML" class="space-y-4">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Shift from</label>
                        <input type="time" name="startTime" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-white focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Offset (Min)</label>
                        <input type="number" name="offsetMinutes" value="60" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-white focus:ring-blue-500">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-lg px-4 py-2 transition-colors">Shift Schedule</button>
            </form>
        </section>

        <section class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
            <h2 class="text-lg font-semibold mb-2 text-white">Nightly Orchestration</h2>
            <form hx-post="/ui/blocks" hx-target="#protocol-container" hx-swap="outerHTML" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Category</label>
                    <input list="category-options" name="category" required placeholder="Select or type new..." class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-white focus:ring-blue-500">
                    <datalist id="category-options"><option th:each="cat : ${categories}" th:value="${cat}"></option></datalist>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Day</label>
                        <select name="targetDate" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs text-white">
                            <option value="TODAY">Today</option>
                            <option value="TOMORROW" selected>Tomorrow</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Start</label>
                        <input type="time" name="startTime" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs text-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">End</label>
                        <input type="time" name="endTime" required class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-xs text-white">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Reason / Focus</label>
                    <input type="text" name="reason" placeholder="e.g. System Design HLD" class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2 text-sm text-white focus:ring-blue-500">
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium text-sm rounded-lg px-4 py-2 transition-colors">Lock Block</button>
            </form>
        </section>
    </div>

    <div class="lg:col-span-2">

        <div id="protocol-container" th:fragment="protocol-fragment">

            <div id="toast-container" hx-swap-oob="true" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2">
                <div th:if="${toastMessage}"
                     x-data="{ show: true }" x-init="setTimeout(() => show = false, 4000)" x-show="show"
                     x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0"
                     x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 translate-y-0" x-transition:leave-end="opacity-0 translate-y-2"
                     class="bg-emerald-600 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 border border-emerald-500">
                    <svg class="w-5 h-5 text-emerald-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    <span class="font-medium text-sm" th:text="${toastMessage}"></span>
                </div>
            </div>

            <div id="efficiency-metric" hx-swap-oob="true" class="bg-slate-800 px-6 py-6 rounded-xl border border-slate-700 text-center shadow-lg">
                <p class="text-sm text-slate-400 uppercase tracking-wide font-semibold">Daily Efficiency</p>
                <p class="text-5xl font-bold text-emerald-400 mt-2" th:text="${efficiencyScore + '%'}">100.0%</p>
                <p class="text-xs text-slate-500 mt-2" th:text="${currentDate}">2026-03-13</p>
            </div>

            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white">Active Protocol</h2>

                <input type="date" name="date" th:value="${currentDate}"
                       hx-get="/ui/protocol" hx-target="#protocol-container" hx-swap="outerHTML"
                       class="bg-slate-800 border border-slate-600 rounded-lg p-2 text-sm text-white focus:ring-blue-500 focus:border-blue-500 shadow-sm cursor-pointer">
            </div>

            <div class="overflow-hidden bg-slate-800 rounded-xl border border-slate-700 shadow-lg">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/80 text-xs uppercase text-slate-500 border-b border-slate-700">
                    <tr>
                        <th class="px-5 py-4 font-semibold">Time Window</th>
                        <th class="px-5 py-4 font-semibold">Category</th>
                        <th class="px-5 py-4 font-semibold">Focus</th>
                        <th class="px-5 py-4 font-semibold text-right">Status</th>
                    </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-700">
                    <tr th:if="${blocks.isEmpty()}">
                        <td colspan="4" class="px-5 py-12 text-center text-slate-500 bg-slate-800/50">
                            <p class="text-base">No protocol established for this date.</p>
                            <p class="text-xs mt-1">Execute the Nightly Orchestration to populate.</p>
                        </td>
                    </tr>

                    <tr th:each="block : ${blocks}" class="hover:bg-slate-700/50 transition-colors group">
                        <td class="px-5 py-4 whitespace-nowrap font-medium text-slate-200">
                            <span th:text="${#temporals.format(block.plannedStart, 'hh:mm a')}"></span>
                            <span class="text-slate-500 mx-1">→</span>
                            <span th:text="${#temporals.format(block.plannedEnd, 'hh:mm a')}"></span>
                        </td>
                        <td class="px-5 py-4">
                            <span class="text-xs font-bold text-blue-400 uppercase tracking-wider" th:text="${block.category}"></span>
                        </td>
                        <td class="px-5 py-4 text-slate-300" th:text="${block.reason}"></td>
                        <td class="px-5 py-4 text-right">
                            <span class="bg-slate-700/50 border border-slate-600 text-slate-300 text-xs font-semibold px-2.5 py-1 rounded shadow-sm" th:text="${block.status}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
